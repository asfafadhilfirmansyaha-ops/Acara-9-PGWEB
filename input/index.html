<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><title>Form Input</title></head>
<body>
<h2>Form Input</h2>

<form action="input.php" method="post" onsubmit="return validateForm()">
    Kecamatan:<br>
    <input name="kecamatan" id="kec" required><br>
    Longitude:<br>
    <input type="number" name="longitude" min="-180" max="180" step="any" required><br>
    Latitude:<br>
    <input type="number" name="latitude" min="-90" max="90" step="any" required><br>
    Luas:<br>
    <input type="number" name="luas" id="luas" min="1" step="any" required><br>
    Jumlah Penduduk:<br>
    <input type="number" name="jumlah_penduduk" id="jml" min="0" step="1" required><br><br>
    <input type="submit" value="Submit">
</form>

<p id="informasi"></p>
<a href="../index.php">Kembali</a>

<script>
function validateForm() {
    let kec = document.getElementById("kec").value.trim();
    let luas = Number(document.getElementById("luas").value);
    let jumlah = Number(document.getElementById("jml").value);

    if (kec === "" || !Number.isFinite(luas) || luas < 1 ||
        !Number.isInteger(jumlah) || jumlah < 0) {
        document.getElementById("informasi").textContent =
            "Isi kecamatan, luas minimal 1, dan jumlah penduduk berupa bilangan bulat nol atau lebih.";
        return false;
    }
    return true;
}
</script>
</body>
</html>
